name: Verify Streamlit deployment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: streamlit_app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r streamlit_app/requirements.txt
      - run: python -m unittest discover -s streamlit_app -p test_app.py
      - run: node win7/test_engine.cjs
      - run: node win7/test_student_readings.cjs
